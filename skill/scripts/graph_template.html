<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Graph View</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: the 3D picture and the "what you clicked" panel sit side by side.
   Days are the larger orange dots, Terms the smaller blue ones. */
:root {
  --bg: #f2f4f8;
  --surface: #ffffff;
  --fg: #161d29;
  --muted: #566275;
  --rule: #d5dbe5;
  --line: #aab4c3;
  --day: #b4690e;
  --day-soft: #fbefdc;
  --term: #3d4fc4;
  --term-soft: #e6e9fb;
  --font-display: "Space Grotesk", ui-sans-serif, system-ui, sans-serif;
  --font-body: Inter, ui-sans-serif, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11151c; --surface: #19202a; --fg: #e7ecf3; --muted: #9aa6b8;
    --rule: #2c3644; --line: #4a5668;
    --day: #e5a445; --day-soft: #3a2c14; --term: #98a4ff; --term-soft: #232a52;
    color-scheme: dark;
  }
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  padding: 32px 16px 48px;
}
.page { max-width: 1040px; margin-inline: auto; display: grid; gap: 28px; }
p, h1, h2, ol, ul { margin: 0; }
ol, ul { padding: 0; list-style: none; }

.intro { display: grid; gap: 10px; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: 30px; line-height: 1.15; }
.intro p { max-width: 62ch; color: var(--muted); }
.intro strong { color: var(--fg); font-weight: 600; }

.stage { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 760px) { .stage { grid-template-columns: minmax(0, 1fr); } }

.picture { display: grid; gap: 12px; min-width: 0; }
.canvas { position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; }
.labels { position: absolute; inset: 0; pointer-events: none; }
.label {
  position: absolute; left: 0; top: 0; display: inline-flex; align-items: center; gap: 5px;
  font: 500 12.5px/1.5 var(--font-body); color: var(--fg); white-space: nowrap;
  background: color-mix(in srgb, var(--surface) 80%, transparent);
  border: 0; border-radius: 999px; padding: 1px 8px 1px 6px; cursor: pointer; pointer-events: auto;
}
.label[hidden] { display: none; }
.label span { max-width: 20ch; overflow: hidden; text-overflow: ellipsis; }
.label .key { width: 8px; height: 8px; flex: none; }
.label.on { font-weight: 600; color: var(--surface); background: var(--fg); }
.label:focus-visible, .jump:focus-visible { outline: 2px solid var(--term); outline-offset: 2px; }
.fail { padding: 24px; color: var(--muted); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.key { width: 13px; height: 13px; border: 2px solid; display: inline-block; }
.key.day { border-color: var(--day); background: var(--day-soft); border-radius: 4px; }
.key.term { border-color: var(--term); background: var(--term-soft); border-radius: 50%; }
.count { font-weight: 500; font-variant-numeric: tabular-nums; }

.panel { min-width: 0; display: grid; gap: 10px; align-content: start; padding: 4px 0 0 4px; }
.kind { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
.kind.day { color: var(--day); }
.kind.term { color: var(--term); }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 24px; line-height: 1.2; overflow-wrap: anywhere; }
.lead { max-width: 46ch; }
.sub { color: var(--muted); font-size: 14px; }
.timeline, .mentions { display: grid; gap: 12px; border-top: 1px solid var(--rule); padding-top: 12px; }
.timeline li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; }
.timeline li > div { display: grid; gap: 4px; min-width: 0; }
.mentions li { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.time { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.note { font-weight: 500; overflow-wrap: anywhere; }
.explain { font-size: 14px; color: var(--muted); }
.also { color: var(--fg); }
.jump {
  font: inherit; font-weight: 600; color: var(--term); background: none; border: 0; padding: 0;
  cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-align: left;
}
.jump.day { color: var(--day); }
</style>
</head>
<body>
<main class="page">
  <header class="intro">
    <h1>Graph View</h1>
    <p>Each <strong>Day</strong> is one dot and each <strong>Term</strong> is one dot. A line means "this Term came up on this Day". Drag the background to turn the picture, scroll to zoom, click a dot to read it.</p>
  </header>

  <section class="stage">
    <div class="picture">
      <div class="canvas">
        <div id="graph" aria-hidden="true"></div>
        <div class="labels" id="labels" role="group" aria-label="Dots of the Graph View"></div>
      </div>
      <div class="legend">
        <span><i class="key day"></i>Day</span>
        <span><i class="key term"></i>Term</span>
        <span class="count" id="count"></span>
      </div>
    </div>
    <div class="panel" id="panel" aria-live="polite"></div>
  </section>
</main>

<!-- meetup.py puts the Notes and Terms here. The page reads nothing else. -->
<script type="application/json" id="data">__DATA__</script>
<!-- 3d-force-graph draws the 3D picture. The checksum makes the browser refuse any other file. -->
<script src="https://cdn.jsdelivr.net/npm/3d-force-graph@1.80.2/dist/3d-force-graph.min.js"
        integrity="sha256-rptcqdUlCVl40PXSP5E23+F3sulJdzEC/78UXdd3bwQ="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
(function () {
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var data = JSON.parse(document.getElementById('data').textContent);
  var notes = data.notes;   // [{day, time, text, terms: [names]}], in the order they were saved
  var TERMS = data.terms;   // {name: description or null}

  var panel = document.getElementById('panel');
  var count = document.getElementById('count');

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function uniq(a) { return a.filter(function (v, i) { return a.indexOf(v) === i; }); }
  function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }

  var days = uniq(notes.map(function (n) { return n.day; })).sort();
  var terms = Object.keys(TERMS);
  var links = [];   // one per "this Term came up on this Day"
  days.forEach(function (d) {
    var names = [];
    notes.forEach(function (n) { if (n.day === d) names = names.concat(n.terms); });
    uniq(names).forEach(function (t) { links.push({ source: 'day:' + d, target: 'term:' + t }); });
  });

  // The year is only shown once the Notes span more than one year.
  var manyYears = uniq(days.map(function (d) { return d.slice(0, 4); })).length > 1;
  function fmt(d) {
    var p = d.split('-');
    return Number(p[2]) + ' ' + MONTHS[Number(p[1]) - 1] + (manyYears ? ' ' + p[0] : '');
  }
  function daysOf(term) {
    return uniq(notes.filter(function (n) { return n.terms.indexOf(term) > -1; })
      .map(function (n) { return n.day; })).sort();
  }
  function describe(term) { return TERMS[term] ? esc(TERMS[term]) : 'No description yet.'; }

  function panelDay(d) {
    var list = notes.filter(function (n) { return n.day === d; });
    var h = '<p class="kind day">Day</p><h2>' + fmt(d) + '</h2>' +
      '<p class="sub">Its Timeline: ' + plural(list.length, 'Note') + ', in the order you sent them.</p><ol class="timeline">';
    list.forEach(function (n) {
      h += '<li><span class="time">' + esc(n.time) + '</span><div><p class="note">' + esc(n.text) + '</p>';
      n.terms.forEach(function (t) {
        var others = daysOf(t).filter(function (x) { return x !== d; });
        h += '<p class="explain"><button type="button" class="jump" data-key="term:' + esc(t) + '">' + esc(t) + '</button> ' +
          describe(t) + ' <span class="also">' +
          (others.length ? 'Also on ' + others.map(fmt).join(', ') + '.' : 'Only on this Day so far.') + '</span></p>';
      });
      h += '</div></li>';
    });
    return h + '</ol>';
  }

  function panelTerm(t) {
    var list = notes.filter(function (n) { return n.terms.indexOf(t) > -1; });
    var h = '<p class="kind term">Term</p><h2>' + esc(t) + '</h2><p class="lead">' + describe(t) + '</p>' +
      '<p class="sub">One dot, ' + plural(daysOf(t).length, 'line') + '. It came up in:</p><ul class="mentions">';
    list.forEach(function (n) {
      h += '<li><button type="button" class="jump day" data-key="day:' + n.day + '">' + fmt(n.day) + '</button>' +
        '<span class="time">' + esc(n.time) + '</span><span class="note">' + esc(n.text) + '</span></li>';
    });
    return h + '</ul>';
  }

  count.textContent = (days.length + terms.length) + ' dots: ' + plural(days.length, 'Day') + ' and ' +
    plural(terms.length, 'Term') + '. ' + plural(links.length, 'line') + '.';

  if (!notes.length) {
    panel.innerHTML = '<p class="sub">No Notes yet. Send one to the bot, then reload this page.</p>';
    return;
  }

  var nodes = days.map(function (d) { return { key: 'day:' + d, kind: 'day', label: fmt(d) }; })
    .concat(terms.map(function (t) { return { key: 'term:' + t, kind: 'term', label: t }; }));
  var sel = 'day:' + days[days.length - 1];   // start on the latest Day

  // Every dot has a name tag: an ordinary button laid over the 3D picture. It carries the
  // square or round key from the legend, and it makes each dot reachable by keyboard.
  var labels = document.getElementById('labels');
  nodes.forEach(function (n) {
    var tag = document.createElement('button'), key = document.createElement('i'), name = document.createElement('span');
    tag.type = 'button';
    tag.className = 'label';
    tag.hidden = true;
    tag.setAttribute('data-key', n.key);
    tag.setAttribute('aria-label', n.label + ', ' + (n.kind === 'day' ? 'Day' : 'Term'));
    key.className = 'key ' + n.kind;
    name.textContent = n.label;
    tag.append(key, name);
    labels.appendChild(tag);
    n.tag = tag;
  });

  var REL = 7;   // dot size: radius = REL * cube root of size(n)
  function size(n) { return (n.kind === 'day' ? 2 : 1) * (n.key === sel ? 2.2 : 1); }
  function touches(l) { return (l.source.key || l.source) === sel || (l.target.key || l.target) === sel; }

  var box = document.querySelector('.canvas');
  var still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var Graph = null;
  try {
    if (!window.ForceGraph3D) {
      throw new Error('The picture needs a drawing library from the internet, and it did not load. ' +
        'Check the connection, then reload this page.');
    }
    Graph = new ForceGraph3D(document.getElementById('graph'), { controlType: 'orbit' })
      .nodeId('key')
      .nodeLabel(null)
      .nodeRelSize(REL)
      .nodeOpacity(1)
      .nodeResolution(20)
      .linkOpacity(0.75)
      .showNavInfo(false)
      .warmupTicks(still ? 300 : 150)   // settle the layout before the first picture
      .cooldownTicks(still ? 0 : Infinity)
      .cooldownTime(3000)
      .onNodeClick(function (n) { sel = n.key; render(); })
      .graphData({ nodes: nodes, links: links });
    Graph.d3Force('link').distance(55);     // room for the name tags between dots
    Graph.d3Force('charge').strength(-90);
  } catch (error) {
    Graph = null;
    document.getElementById('graph').innerHTML = '<p class="fail">' + esc(error.message || error) + '</p>';
  }

  // Colours come from the page's own light and dark themes.
  function paint() {
    if (!Graph) return;
    var css = getComputedStyle(document.documentElement), c = {};
    ['surface', 'line', 'fg', 'day', 'term'].forEach(function (k) { c[k] = css.getPropertyValue('--' + k).trim(); });
    Graph.backgroundColor(c.surface)
      .nodeColor(function (n) { return c[n.kind]; })
      .nodeVal(size)
      .linkColor(function (l) { return touches(l) ? c.fg : c.line; })
      .linkWidth(function (l) { return touches(l) ? 1.2 : 0.4; });
  }

  function render() {
    var i = sel.indexOf(':'), kind = sel.slice(0, i), id = sel.slice(i + 1);
    nodes.forEach(function (n) {
      n.tag.classList.toggle('on', n.key === sel);
      n.tag.setAttribute('aria-pressed', n.key === sel);
    });
    panel.innerHTML = kind === 'day' ? panelDay(id) : panelTerm(id);
    paint();
  }

  document.addEventListener('click', function (e) {
    var target = e.target.closest ? e.target.closest('[data-key]') : null;
    if (target) { sel = target.getAttribute('data-key'); render(); }
  });

  render();
  if (!Graph) {   // no picture: the name tags become a plain list, so the panel still works
    nodes.forEach(function (n) { n.tag.hidden = false; n.tag.style.position = 'static'; });
    labels.style.cssText = 'position: static; display: flex; flex-wrap: wrap; gap: 8px; padding: 0 24px 24px; pointer-events: auto;';
    return;
  }

  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paint);

  function resize() {
    var w = box.clientWidth, h = Math.max(300, Math.min(640, Math.round(w * 0.8)));
    if (w && (w !== Graph.width() || h !== Graph.height())) Graph.width(w).height(h);
  }
  resize();
  new ResizeObserver(resize).observe(box);

  var fitted = false;
  function fit() {   // once, when the layout first exists: bring every dot into view
    if (fitted) return;
    fitted = true;
    // One frame later: the library moves the dots to their places only after this callback.
    requestAnimationFrame(function () { Graph.zoomToFit(0, 45); });
  }
  Graph.onEngineTick(fit).onEngineStop(fit);

  // Keep each name tag just under its dot while the picture turns.
  // ponytail: every tag is moved on every frame, which is fine up to a few hundred dots.
  // Beyond that, show tags only for the selected dot and its neighbours.
  function placeTags() {
    requestAnimationFrame(placeTags);
    var cam = Graph.camera(), eye = cam.position, at = Graph.controls().target;
    var fx = at.x - eye.x, fy = at.y - eye.y, fz = at.z - eye.z, flen = Math.hypot(fx, fy, fz) || 1;
    var zoom = Graph.height() / 2 / Math.tan(cam.fov * Math.PI / 360);   // pixels per unit at depth 1
    var near = Infinity, far = 0;
    nodes.forEach(function (n) {   // depth: how far in front of the camera the dot is
      n.depth = n.x === undefined ? -1 : ((n.x - eye.x) * fx + (n.y - eye.y) * fy + (n.z - eye.z) * fz) / flen;
      if (n.depth > 0) { near = Math.min(near, n.depth); far = Math.max(far, n.depth); }
    });
    nodes.forEach(function (n) {
      n.tag.hidden = n.depth <= 0;
      if (n.tag.hidden) return;
      var p = Graph.graph2ScreenCoords(n.x, n.y, n.z);
      var radius = REL * Math.cbrt(size(n)) * zoom / n.depth;
      n.tag.style.transform = 'translate(calc(' + p.x.toFixed(1) + 'px - 50%), ' + (p.y + radius + 4).toFixed(1) + 'px)';
      n.tag.style.opacity = n.key === sel ? 1 : (1 - 0.5 * (n.depth - near) / (far - near || 1)).toFixed(2);   // farther is fainter
      n.tag.style.zIndex = n.key === sel ? 100000 : Math.max(1, Math.round(50000 - n.depth));
    });
  }
  placeTags();
})();
</script>
</body>
</html>
